<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>白鹿管理后台原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600&display=swap">
<style>
/* 白鹿俱乐部 设计规范 · 语义色（来自规范库 tokens.json）。light = 象牙（默认），dark = 夜紫。 */
:root{
  --surface:#F7F3EC; --surface-raised:#FFFFFF; --surface-sunken:#EFE8DD; --surface-inverse:#230D30; --surface-inverse-2:#13061A;
  --border:#E6DED2; --border-strong:#8F8494;
  --ink:#1E1622; --ink-muted:#6E6373; --ink-disabled:#A79DA9; --ink-inverse:#F5EEE2; --ink-inverse-muted:#BFA9C4;
  --primary:#230D30; --primary-hover:#3D1A40; --on-primary:#E8D9B8;
  --accent:#C9A86F; --accent-text:#8A6A35; --focus-ring:#8A6A35;
  --tag-bg:#F3EBDD; --tag-text:#6B5128;
  --success:#2F6B4F; --success-bg:#E4F0E9; --warning:#9A5B12; --warning-bg:#F7EBDA;
  --danger:#9E3434; --danger-bg:#F6E3E3; --info:#2D5A8A; --info-bg:#E3ECF6;
  --neutral-tag-bg:#EEE6F0; --neutral-tag:#3D1A40;
  --plum-50:#F6F0F7; --plum-600:#5A2D5E; --neutral-400:#CFC6D0; --avatar-bg:#E8D9B8; --avatar-ink:#230D30;
  --tier-platinum:#3D1A40; --tier-foil:#C9A86F; --tier-ink:#F5EEE2; --inverse-track:#3A2442; --inverse-line:#4A2A52; --inverse-tile:#2E1838;
  --data-1:#3D1A40; --data-2:#C9A86F; --data-3:#2D5A8A; --data-4:#8E6695; --data-5:#B08F55;
  --scrim:rgba(19,6,26,.55);
  --shadow-2:0 8px 24px rgba(35,13,48,0.10); --shadow-3:0 16px 48px rgba(35,13,48,0.18);
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --display:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --surface:#13061A; --surface-raised:#230D30; --surface-sunken:#0C0412; --surface-inverse:#2A1236; --surface-inverse-2:#0C0412;
  --border:#3A2442; --border-strong:#85698C;
  --ink:#F5EEE2; --ink-muted:#BFA9C4; --ink-disabled:#6B5A70; --ink-inverse:#F5EEE2; --ink-inverse-muted:#BFA9C4;
  --primary:#C9A86F; --primary-hover:#D9C092; --on-primary:#13061A;
  --accent:#C9A86F; --accent-text:#C9A86F; --focus-ring:#E8D9B8;
  --tag-bg:#3A2A18; --tag-text:#E8D9B8;
  --success:#8FC2A4; --success-bg:#1B2A22; --warning:#E3B877; --warning-bg:#33240F;
  --danger:#E8A8A8; --danger-bg:#3A1A1C; --info:#9DB9DE; --info-bg:#16233A;
  --neutral-tag-bg:#3A2442; --neutral-tag:#E8D9B8;
  --plum-50:#2E1838; --plum-600:#B391B9; --neutral-400:#6B5A70; --avatar-bg:#3A2A18; --avatar-ink:#E8D9B8;
  --inverse-track:#3A2442; --inverse-line:#4A2A52; --inverse-tile:#3A1F46;
  --data-1:#B391B9; --data-2:#C9A86F; --data-3:#9DB9DE; --data-4:#D3BAD7; --data-5:#E3B877;
  --shadow-2:0 8px 24px rgba(0,0,0,0.50); --shadow-3:0 16px 48px rgba(0,0,0,0.60);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --surface:#13061A; --surface-raised:#230D30; --surface-sunken:#0C0412; --surface-inverse:#2A1236; --surface-inverse-2:#0C0412;
  --border:#3A2442; --border-strong:#85698C;
  --ink:#F5EEE2; --ink-muted:#BFA9C4; --ink-disabled:#6B5A70; --ink-inverse:#F5EEE2; --ink-inverse-muted:#BFA9C4;
  --primary:#C9A86F; --primary-hover:#D9C092; --on-primary:#13061A;
  --accent:#C9A86F; --accent-text:#C9A86F; --focus-ring:#E8D9B8;
  --tag-bg:#3A2A18; --tag-text:#E8D9B8;
  --success:#8FC2A4; --success-bg:#1B2A22; --warning:#E3B877; --warning-bg:#33240F;
  --danger:#E8A8A8; --danger-bg:#3A1A1C; --info:#9DB9DE; --info-bg:#16233A;
  --neutral-tag-bg:#3A2442; --neutral-tag:#E8D9B8;
  --plum-50:#2E1838; --plum-600:#B391B9; --neutral-400:#6B5A70; --avatar-bg:#3A2A18; --avatar-ink:#E8D9B8;
  --inverse-track:#3A2442; --inverse-line:#4A2A52; --inverse-tile:#3A1F46;
  --data-1:#B391B9; --data-2:#C9A86F; --data-3:#9DB9DE; --data-4:#D3BAD7; --data-5:#E3B877;
  --shadow-2:0 8px 24px rgba(0,0,0,0.50); --shadow-3:0 16px 48px rgba(0,0,0,0.60);
  color-scheme:dark;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:22px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-muted)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.side{flex:0 0 232px;width:232px;background:var(--surface-inverse-2);padding:24px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding-left:max(14px,env(safe-area-inset-left,0px))}
.side .logo{height:34px;width:auto;align-self:flex-start;margin:0 0 26px 14px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px 0 0;border-radius:10px;text-decoration:none;font-size:14px;color:var(--ink-inverse-muted)}
.nav a::before{content:"";width:3px;height:20px;border-radius:2px;background:transparent;flex:none}
.nav a:hover{background:var(--inverse-tile);color:var(--ink-inverse)}
.nav a[aria-current="page"]{background:var(--inverse-track);color:var(--ink-inverse)}
.nav a[aria-current="page"]::before{background:var(--accent)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.side :focus-visible,.mbar :focus-visible{outline-color:var(--accent)}
.side .foot{margin-top:auto;padding:16px 14px 0;font-size:12px;line-height:18px;color:var(--ink-inverse-muted)}

.mbar{display:none}
.main{flex:1 1 auto;min-width:0;padding:28px max(36px,env(safe-area-inset-right,0px)) 40px 36px;display:flex;flex-direction:column;gap:22px}

/* page header */
.phead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.crumb{font-size:12.5px;line-height:18px;color:var(--ink-muted)}
.phead h1{margin:4px 0 0;font-family:var(--serif);font-size:26px;line-height:34px;font-weight:600;color:var(--ink)}
.tools{display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 14px;width:260px;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:999px;color:var(--ink-muted)}
.search:focus-within{outline:2px solid var(--focus-ring);outline-offset:2px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--ink-muted)}
.search input::-webkit-search-cancel-button{display:none}
.search .x{width:28px;height:28px;border:0;border-radius:14px;background:transparent;display:none;align-items:center;justify-content:center;color:var(--ink-muted);padding:0}
.search.has .x{display:flex}
.iconbtn{width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);padding:0;flex:none;position:relative}
.iconbtn:hover{background:var(--surface-sunken)}
.iconbtn .dot{position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:4px;background:var(--danger);border:1.5px solid var(--surface)}
.avatar{width:36px;height:36px;border-radius:18px;background:var(--avatar-bg);color:var(--avatar-ink);display:flex;align-items:center;justify-content:center;font-weight:600;font-family:var(--serif);flex:none}

/* cards */
.card{background:var(--surface-raised);border:1px solid var(--border);border-radius:16px}
.card h2{margin:0;font-family:var(--serif);font-size:18px;line-height:26px;font-weight:600;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:20px 22px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:13px;color:var(--ink-muted)}
.kpi .v{font-family:var(--display);font-size:36px;font-weight:600;line-height:1.1;color:var(--ink)}
.kpi .d{font-size:12.5px;line-height:18px;color:var(--success)}
.row2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.sec{padding:20px 22px}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:block}
.chart{position:relative;margin-top:12px;height:270px;outline:none;border-radius:10px}
.chart:focus-visible{outline:2px solid var(--focus-ring);outline-offset:4px}
.chart svg{display:block;width:100%;height:270px;overflow:visible}
.tip{position:absolute;top:0;left:0;pointer-events:none;background:var(--surface-raised);border:1px solid var(--border);box-shadow:var(--shadow-2);border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:19px;white-space:nowrap;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip span{display:flex;align-items:center;gap:6px}
.tip i{width:8px;height:8px;border-radius:4px;display:block}
.hot{display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-direction:column;gap:6px}
.bar .t{display:flex;justify-content:space-between;font-size:13.5px}
.bar .tr{height:6px;border-radius:3px;background:var(--surface-sunken)}
.bar .tr i{display:block;height:6px;border-radius:3px;background:var(--data-1)}
.link{font-size:13px;color:var(--accent-text);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;padding:0 4px}
.link:hover{text-decoration:underline}

/* table */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:13px 11px;font-size:12.5px;line-height:18px;color:var(--ink-muted);font-weight:500;background:var(--surface-sunken);border-bottom:1px solid var(--border);white-space:nowrap}
td{text-align:left;padding:13px 11px;font-size:13.5px;line-height:20px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.bk tbody tr{cursor:pointer}
.bk tbody tr:hover td{background:var(--surface-sunken)}
.bk tbody tr[aria-selected="true"] td{background:var(--plum-50)}
.bk tbody tr[aria-selected="true"] td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.rowbtn{all:unset;cursor:pointer;font-variant-numeric:tabular-nums;border-radius:4px}
.rowbtn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:12px;line-height:22px;font-weight:500;white-space:nowrap}
.tag.warning{background:var(--warning-bg);color:var(--warning)}
.tag.success{background:var(--success-bg);color:var(--success)}
.tag.info{background:var(--info-bg);color:var(--info)}
.tag.neutral{background:var(--neutral-tag-bg);color:var(--neutral-tag)}
.tag.danger{background:var(--danger-bg);color:var(--danger)}

/* bookings */
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface-raised);color:var(--ink);font-size:13px;white-space:nowrap}
.chip:hover{border-color:var(--border-strong)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface-raised);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--border-strong)}
.btn.lg{height:44px;font-size:14px;padding:0 20px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--surface-raised)}
.btn:disabled{background:var(--surface-sunken);border-color:var(--surface-sunken);color:var(--ink-disabled);cursor:not-allowed}
.spin{width:16px;height:16px;border-radius:8px;border:2px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.bklayout{display:flex;gap:16px;align-items:flex-start}
.bklist{flex:1 1 auto;min-width:0;padding:8px 8px 4px}
.listfoot{padding:10px 11px 8px;font-size:12.5px;line-height:18px;color:var(--ink-muted)}
.detail{flex:0 0 300px;width:300px;padding:22px;display:flex;flex-direction:column;gap:14px;position:sticky;top:20px}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dhead h2{font-family:var(--serif);font-size:18px;line-height:26px;margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.dimg{width:100%;height:140px;object-fit:cover;border-radius:12px;display:block}
.dph{width:100%;height:140px;border-radius:12px;background:var(--surface-inverse);display:flex;align-items:center;justify-content:center}
.dph img{height:60px;width:auto}
.kv{font-size:13.5px;line-height:20px;display:flex;flex-direction:column;gap:8px}
.kv div{display:flex;justify-content:space-between;gap:12px}
.kv div span:first-child{color:var(--ink-muted);flex:none}
.kv div span:last-child{text-align:right}
.kv .tot{font-weight:600}
.kv .tot span:first-child{color:var(--ink)}
.log{border-top:1px solid var(--border);padding-top:12px;font-size:12.5px;line-height:19px;color:var(--ink-muted)}
.log ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.log li{display:flex;gap:8px}
.log li b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;flex:none}
.log li.new b{color:var(--accent-text)}
.acts{display:flex;gap:10px}
.acts .btn{height:42px;font-size:14px}
.acts .btn:first-child{flex:1}
.acts .btn:last-child{flex:2}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:20px;padding:12px 14px;border-radius:10px;background:var(--surface-sunken);color:var(--ink)}
.note svg{flex:none;margin-top:2px;color:var(--ink-muted)}
.note.danger{background:var(--danger-bg);color:var(--danger)}
.note.danger svg{color:var(--danger)}
.note.success{background:var(--success-bg);color:var(--success)}
.note.success svg{color:var(--success)}

/* empty states */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 20px}
.empty .seal{width:64px;height:64px;border-radius:16px;background:var(--surface-inverse);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.empty .seal img{height:40px;width:auto}
.empty h3{margin:0;font-family:var(--serif);font-size:17px;line-height:24px;font-weight:600}
.empty p{margin:0;font-size:13.5px;color:var(--ink-muted)}
.module{flex:1;display:flex;align-items:center;justify-content:center;padding:72px 24px;min-height:420px}
.module .in{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;max-width:360px}
.module .seal{width:96px;height:96px;border-radius:24px;background:var(--surface-inverse);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.module .seal img{height:56px;width:auto}
.module .eyebrow{font-family:var(--display);font-style:italic;font-size:20px;color:var(--accent-text)}
.module h2{margin:0;font-family:var(--serif);font-size:24px;line-height:32px;font-weight:600}
.module p{margin:0;color:var(--ink-muted);font-size:14px}
.module .btn{margin-top:10px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface-raised);z-index:41;box-shadow:var(--shadow-3);transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.drawer .dbar{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 0 22px}
.drawer .dbar span{font-size:12.5px;color:var(--ink-muted)}
.drawer .detail{position:static;flex:1 1 auto;width:auto;border:0;border-radius:0;overflow-y:auto;padding:8px 22px max(22px,env(safe-area-inset-bottom,0px))}
.drawer .dimg,.drawer .dph{height:170px}
.modalwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.modalwrap[hidden]{display:none}
.modal{position:relative;width:min(440px,100%);background:var(--surface-raised);border-radius:22px;box-shadow:var(--shadow-3);padding:24px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-size:16px;line-height:24px;font-weight:600}
.modal p{margin:0;font-size:13.5px;line-height:21px;color:var(--ink-muted)}
.field label{display:block;font-size:12.5px;line-height:18px;font-weight:500;color:var(--ink-muted);margin-bottom:6px}
.field textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface-raised);padding:10px 12px;font-size:14px;line-height:22px}
.field textarea:focus{outline:2px solid var(--focus-ring);outline-offset:1px}
.field textarea[aria-invalid="true"]{border-color:var(--danger)}
.field .err{margin-top:6px;font-size:12.5px;line-height:18px;color:var(--danger)}
.modal .row{display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-inverse);color:var(--ink-inverse);font-size:13px;line-height:20px;padding:10px 18px;border-radius:999px;z-index:60;box-shadow:var(--shadow-2);max-width:calc(100% - 32px);text-align:center}

/* ---------- responsive ---------- */
@media (max-width:1279px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:1100px){ .row2{grid-template-columns:minmax(0,1fr)} }
@media (max-width:899px){
  .shell{flex-direction:column}
  .side{display:none}
  .mbar{display:block;position:sticky;top:0;z-index:30;background:var(--surface-inverse-2);padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
  .mbar .top{display:flex;align-items:center;justify-content:space-between;height:48px}
  .mbar .logo{height:28px;width:auto}
  .mbar .iconbtn{color:var(--ink-inverse)}
  .mbar .iconbtn:hover{background:var(--inverse-tile)}
  .mbar .nav{display:none;padding:6px 0 12px;border-top:1px solid var(--inverse-line);margin-top:6px}
  .mbar.open .nav{display:flex}
  .main{padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));gap:18px}
  .phead h1{font-size:24px;line-height:32px}
  .tools{width:100%}
  .search{flex:1 1 auto;width:auto}
  .kpi{padding:16px 18px}
  .sec{padding:18px 16px}
}
@media (max-width:560px){
  .kpis{gap:12px}

let chartIdx=-1, chartRO=null;
function drawChart(){
  const box=document.getElementById('chart'); if(!box)return;
  const W=Math.max(260,box.clientWidth), H=270, L=22, R=22, T=14;
  const ph=H-50, sx=i=>L+i*(W-L-R)/11, sy=y=>T+y/220*ph;
  const pts=a=>a.map((y,i)=>`${i?'L':'M'}${sx(i).toFixed(1)},${sy(y).toFixed(1)}`).join(' ');
  const grid=[0,55,110,165,220].map(y=>`<line x1="${L}" x2="${W-R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--border)" stroke-width="1"/>`).join('');
  const step=W<480?2:1;
  const labels=MONTHS.map((m,i)=>(i%step===(11%step))?`<text x="${sx(i)}" y="${T+ph+26}" font-size="11" fill="var(--ink-muted)" text-anchor="middle" font-family="var(--sans)">${m}</text>`:'').join('');
  const e1=[sx(11),sy(YR[11])], e2=[sx(11),sy(YB[11])];
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">
    ${grid}
    <line id="guide" x1="0" x2="0" y1="${T}" y2="${T+ph}" stroke="var(--border-strong)" stroke-dasharray="3 3" opacity="0"/>
    <path d="${pts(YR)}" fill="none" stroke="var(--data-1)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${pts(YB)}" fill="none" stroke="var(--data-2)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${e1[0]}" cy="${e1[1]}" r="5" fill="var(--data-1)" stroke="var(--surface-raised)" stroke-width="2"/>
    <circle cx="${e2[0]}" cy="${e2[1]}" r="5" fill="var(--data-2)" stroke="var(--surface-raised)" stroke-width="2"/>
    <text x="${e1[0]-10}" y="${e1[1]-10}" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="end" font-family="var(--sans)">S$ 412,800</text>
    <text x="${e2[0]-10}" y="${e2[1]-10}" font-size="12" font-weight="600" fill="var(--ink)" text-anchor="end" font-family="var(--sans)">347 单</text>
    <g id="hov" opacity="0"><circle id="h1" r="4.5" fill="var(--surface-raised)" stroke="var(--data-1)" stroke-width="2.5"/><circle id="h2" r="4.5" fill="var(--surface-raised)" stroke="var(--data-2)" stroke-width="2.5"/></g>
    ${labels}
  </svg><div class="tip" id="tip" aria-hidden="true"></div>`;
  box._geo={W,sx,sy,T,ph};
  if(chartIdx>=0)showTip(chartIdx);
}
function showTip(i){
  const box=document.getElementById('chart'); if(!box||!box._geo)return;
  const {W,sx,sy}=box._geo; chartIdx=i;
  const x=sx(i), g=box.querySelector('#guide'), hov=box.querySelector('#hov'), tip=box.querySelector('#tip');
  g.setAttribute('x1',x); g.setAttribute('x2',x); g.setAttribute('opacity','1');
  box.querySelector('#h1').setAttribute('cx',x); box.querySelector('#h1').setAttribute('cy',sy(YR[i]));
  box.querySelector('#h2').setAttribute('cx',x); box.querySelector('#h2').setAttribute('cy',sy(YB[i]));
  hov.setAttribute('opacity','1');
  tip.innerHTML=`<b>${MONTHS[i]}</b><span><i style="background:var(--data-1)"></i>营收 S$ ${fmt(REV[i])}</span><span><i style="background:var(--data-2)"></i>预约 ${BKS[i]} 单</span>`;
  tip.classList.add('on');
  const tw=tip.offsetWidth, top=Math.min(sy(YR[i]),sy(YB[i]));
  let left=x+14; if(left+tw>W) left=x-14-tw; if(left<0) left=0;
  tip.style.transform=`translate(${left}px,${Math.max(0,top-56)}px)`;
}
function hideTip(){
  const box=document.getElementById('chart'); if(!box)return; chartIdx=-1;
  box.querySelector('#tip')?.classList.remove('on');
  box.querySelector('#guide')?.setAttribute('opacity','0'); box.querySelector('#hov')?.setAttribute('opacity','0');
}
function bindChart(){
  const box=document.getElementById('chart'); if(!box)return;
  drawChart();
  if(chartRO)chartRO.disconnect();
  if('ResizeObserver' in window){ chartRO=new ResizeObserver(()=>drawChart()); chartRO.observe(box); }
  const pick=clientX=>{const r=box.getBoundingClientRect(); const {W,sx}=box._geo; const px=(clientX-r.left)*W/r.width; let best=0,bd=1e9; for(let i=0;i<12;i++){const d=Math.abs(sx(i)-px); if(d<bd){bd=d;best=i;}} return best;};
  box.addEventListener('pointermove',e=>showTip(pick(e.clientX)));
  box.addEventListener('pointerleave',hideTip);
  box.addEventListener('blur',hideTip);
  box.addEventListener('focus',()=>showTip(11));
  box.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'){e.preventDefault();showTip(Math.min(11,(chartIdx<0?11:chartIdx+1)));}
    if(e.key==='ArrowLeft'){e.preventDefault();showTip(Math.max(0,(chartIdx<0?11:chartIdx-1)));}
    if(e.key==='Escape')hideTip();
  });
}

    case '已确认': return N('success','check','已审核通过，等待会员支付。');
    case '已支付': return N('','info','会员已支付，如需退款请联系财务。');
    case '报价中': return N('','info',`管家 ${esc(r.butler)} 正在询价，报价发给会员后再进入审核。`);
    case '已完成': return N('','check','服务已完成，无需操作。');
    case '已退款': return N('danger','info','已退款，积分已退回会员账户。');
    case '已驳回': return N('danger','info','已驳回 · 积分未扣除。会员可以重新提交。');
    default: return '';
  }
}
function detailHTML(r){
  if(!r) return `<div class="empty"><div class="seal"><img src="../img/mark-gold.png" alt=""></div><h3>选择一条预约</h3><p>点左侧表格中的一行查看详情</p></div>`;
  const pending=r.st==='待审核', busy=S.busy===r.id;
  return `<div class="dhead"><h2>${r.id}</h2>${tag(r.st)}</div>
    ${r.img?`<img class="dimg" src="${r.img}" alt="${esc(r.svc)}">`:`<div class="dph"><img src="../img/mark-gold.png" alt=""></div>`}
    <div style="font-family:var(--serif);font-size:15px;line-height:22px;font-weight:600">${esc(r.svc)}</div>
    <div class="kv">
      <div><span>会员</span><span>${esc(r.m)} · ${r.tier}</span></div>
      ${r.kv.map(([a,b,c])=>`<div><span>${a}</span><span${c==='ok'?' style="color:var(--success)"':''}>${esc(b)}</span></div>`).join('')}
      <div><span>管家</span><span>${esc(r.butler)}</span></div>
      <div class="tot"><span>应付</span><span class="num">${r.pay}</span></div>
    </div>
    <div class="log">操作记录<ol>${r.log.map(([t,e,n])=>`<li${n?' class="new"':''}><b>${t}</b><span>${esc(e)}</span></li>`).join('')}</ol></div>
    ${pending?`<div class="acts">
        <button class="btn" data-act="reject" data-id="${r.id}" id="btn-reject" ${busy?'disabled':''}>驳回</button>
        <button class="btn primary" data-act="approve" data-id="${r.id}" id="btn-approve" ${busy?'disabled aria-busy="true"':''}>${busy?'<span class="spin" aria-hidden="true"></span>处理中':'审核通过'}</button>
      </div>`:statusNote(r)}`;
}
function vBookings(){
  const rows=visibleRows(), sel=rowById(S.sel);
  const q=S.q.trim();
  let body;
  if(!rows.length){
    body=q?`<div class="empty"><div class="seal"><img src="../img/mark-gold.png" alt=""></div><h3>没有找到匹配的预约</h3><p>“${esc(q)}”在当前筛选下没有结果，可按会员名或预约号搜索</p><button class="btn" data-act="clear-search" id="btn-clear-search">清除搜索</button></div>`
      :`<div class="empty"><div class="seal"><img src="../img/mark-gold.png" alt=""></div><h3>这个状态下没有示例</h3><p>原型里只放了 9 条示例预约</p><button class="btn" data-filter="all">查看全部</button></div>`;
  } else {
    body=`<div class="tablewrap"><table class="bk" aria-label="预约列表">
      <thead><tr><th>预约号</th><th>会员</th><th>服务</th><th>日期</th><th>管家</th><th>状态</th><th>积分</th></tr></thead>
      <tbody>${rows.map(r=>`<tr data-row="${r.id}" aria-selected="${S.sel===r.id}">
        <td><button class="rowbtn" data-pick="${r.id}" aria-label="查看 ${r.id} 详情">${r.id}</button></td><td>${esc(r.m)}</td><td>${esc(r.svc)}</td><td>${r.date}</td><td>${esc(r.butler)}</td><td>${tag(r.st)}</td><td class="num">${r.pts}</td></tr>`).join('')}</tbody>
    </table></div>`;
  }
  return `
  <div class="toolbar">
    <div class="chips" role="group" aria-label="按状态筛选">${FILTERS.map(([k,l])=>`<button class="chip" data-filter="${k}" id="f-${k}" aria-pressed="${S.filter===k}">${l} <span class="num">${S.counts[k]}</span></button>`).join('')}</div>
    <div style="display:flex;gap:10px"><button class="btn" data-act="toast" data-msg="这一页在正式开发时补齐" id="btn-filter">${ic('filter',16)}筛选</button><button class="btn" data-act="toast" data-msg="正式版支持导出 Excel" id="btn-export">${ic('download',16)}导出</button></div>
  </div>
  <div class="bklayout">
    <section class="card bklist" aria-label="预约列表">${body}<div class="listfoot" role="status">当前显示 ${rows.length} 条示例 · 原型共 9 条，筛选按钮上是本月全部预约数</div></section>
    ${wide.matches?`<aside class="card detail" aria-label="预约详情" id="detail-inline">${detailHTML(sel)}</aside>`:''}
  </div>`;
}

/* ---------- other modules ---------- */
function vModule(k){
  const n=NAV.find(x=>x[0]===k)[2];
  return `<section class="card module" aria-labelledby="h-mod"><div class="in">
    <div class="seal"><img src="../img/mark-gold.png" alt="白鹿标志"></div>
    <div class="eyebrow">${EN[k]}</div>
    <h2 id="h-mod">${n}</h2>
    <p>这一页在正式开发时补齐</p>
    <a class="btn lg" href="#dashboard">回到运营看板</a>
  </div></section>`;
}

/* ---------- render ---------- */
const scrim=document.getElementById('scrim'), drawer=document.getElementById('drawer'), dBody=document.getElementById('drawer-body');
let lastFocus=null;
function renderDrawer(){
  const open=S.route==='bookings'&&!wide.matches&&S.drawer;
  if(open){ dBody.innerHTML=`<div class="card detail">${detailHTML(rowById(S.sel))}</div>`; }
  drawer.classList.toggle('on',open); scrim.classList.toggle('on',open);
  drawer.setAttribute('aria-hidden',!open);
}
function render(){
  const r=S.route;
  document.getElementById('nav-side').innerHTML=navHTML();
  document.getElementById('nav-top').innerHTML=navHTML();
  const name=NAV.find(x=>x[0]===r)[2];
  document.getElementById('crumb').textContent=r==='bookings'?'业务 / 预约管理':'首页 / '+name;
  document.getElementById('ptitle').textContent=name;
  if(chartRO){chartRO.disconnect();chartRO=null;}
  view.innerHTML=r==='dashboard'?vDashboard():r==='bookings'?vBookings():vModule(r);
  if(r==='dashboard')bindChart();
  qForm.classList.toggle('has',!!S.q);
  renderDrawer();
}
function go(r){ if(!NAV.find(x=>x[0]===r))r='dashboard'; S.route=r; S.drawer=false; setMenu(false); render(); window.scrollTo(0,0); try{ if(location.hash!=='#'+r)history.replaceState(null,'','#'+r);}catch(e){} }

let toastTimer;
function toast(msg){ document.querySelector('.toast')?.remove(); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.remove(),2400); }

function openDrawer(){ lastFocus=document.activeElement; S.drawer=true; renderDrawer(); setTimeout(()=>document.getElementById('drawer-close').focus(),30); }
function closeDrawer(){ S.drawer=false; renderDrawer(); const b=document.querySelector(`[data-pick="${S.sel}"]`); (b||lastFocus)?.focus?.(); }
function pick(id){ S.sel=id; if(wide.matches){ render(); document.querySelector(`[data-pick="${id}"]`)?.focus(); } else { render(); openDrawer(); } }

function approve(id){
  const r=rowById(id); if(!r||r.st!=='待审核'||S.busy)return;
  S.busy=id; refreshDetail();
  setTimeout(()=>{
    r.st='已确认'; r.log.push([now(),'运营审核通过',1]);
    S.counts.pending=Math.max(0,S.counts.pending-1); S.counts.confirmed++;
    S.busy=null; render(); toast(`${id} 已审核通过`);
  },1000);
}
function refreshDetail(){
  const r=rowById(S.sel);
  const inl=document.getElementById('detail-inline'); if(inl)inl.innerHTML=detailHTML(r);
  if(drawer.classList.contains('on'))dBody.innerHTML=`<div class="card detail">${detailHTML(r)}</div>`;
}

/* reject modal */
const modal=document.getElementById('modal'), rForm=document.getElementById('reject-form'), rText=document.getElementById('reject-reason'), rErr=document.getElementById('reject-err'), rOk=document.getElementById('reject-ok');
let rejectId=null, modalFocus=null;
function openReject(id){
  rejectId=id; modalFocus=document.activeElement; const r=rowById(id);
  document.getElementById('reject-desc').textContent=`${r.id} · ${r.m} · ${r.svc}。驳回后这笔预约不会扣积分，原因会通知会员。`;
  rText.value=''; rErr.textContent=''; rText.removeAttribute('aria-invalid'); rOk.disabled=false; rOk.textContent='确认驳回';
  modal.hidden=false; setTimeout(()=>rText.focus(),20);
}
function closeReject(){ modal.hidden=true; rejectId=null; (document.getElementById('btn-reject')||modalFocus)?.focus?.(); }
rForm.addEventListener('submit',e=>{
  e.preventDefault(); if(rOk.disabled)return;
  const v=rText.value.trim();
  if(!v){ rErr.textContent='请填写驳回原因'; rText.setAttribute('aria-invalid','true'); rText.focus(); return; }
  rOk.disabled=true; rOk.innerHTML='<span class="spin" aria-hidden="true"></span>处理中';
  document.getElementById('reject-cancel').disabled=true;
  setTimeout(()=>{
    const r=rowById(rejectId);
    r.st='已驳回'; r.log.push([now(),`运营驳回 · 原因：${v} · 积分未扣除`,1]);
    S.counts.pending=Math.max(0,S.counts.pending-1); S.counts.cancelled++;
    document.getElementById('reject-cancel').disabled=false;
    const id=rejectId; modal.hidden=true; rejectId=null; render(); toast(`${id} 已驳回 · 积分未扣除`);
  },800);
});
rText.addEventListener('input',()=>{ if(rText.value.trim()){rErr.textContent='';rText.removeAttribute('aria-invalid');} });

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const navA=e.target.closest('a[href^="#"]');
  if(navA){ const k=navA.getAttribute('href').slice(1); if(NAV.find(x=>x[0]===k)){ e.preventDefault(); go(k); return; } }
  const b=e.target.closest('button');
  if(b&&b.disabled)return;
  if(b){
    const d=b.dataset;
    if(b.id==='menu-btn'){ setMenu(!mbar.classList.contains('open')); return; }
    if(b.id==='bell'){ toast('这一页在正式开发时补齐'); return; }
    if(b.id==='q-clear'){ S.q=''; qInput.value=''; render(); qInput.focus(); return; }
    if(b.id==='drawer-close'){ closeDrawer(); return; }
    if(d.filter){ S.filter=d.filter; render(); document.getElementById('f-'+d.filter)?.focus(); return; }
    if(d.pick){ pick(d.pick); return; }
    switch(d.act){
      case 'toast': toast(d.msg); return;
      case 'approve': approve(d.id); return;
      case 'reject': openReject(d.id); return;
      case 'modal-cancel': if(!document.getElementById('reject-cancel').disabled)closeReject(); return;
      case 'clear-search': S.q=''; qInput.value=''; render(); qInput.focus(); return;
    }
  }
  if(e.target.closest('[data-act="modal-cancel"]')){ if(!document.getElementById('reject-cancel').disabled)closeReject(); return; }
  const tr=e.target.closest('tr[data-row]'); if(tr){ pick(tr.dataset.row); return; }
  if(e.target===scrim){ closeDrawer(); }
});
qInput.addEventListener('input',()=>{
  S.q=qInput.value;
  if(S.route==='bookings'){ render(); } else qForm.classList.toggle('has',!!S.q);
});
qForm.addEventListener('submit',e=>{ e.preventDefault(); S.q=qInput.value; if(S.route!=='bookings')go('bookings'); else render(); });
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!modal.hidden){ if(!document.getElementById('reject-cancel').disabled)closeReject(); return; }
  if(drawer.classList.contains('on')){ closeDrawer(); return; }
  if(mbar.classList.contains('open')){ setMenu(false); menuBtn.focus(); }
});
/* keep Tab inside open drawer / modal */
document.addEventListener('keydown',e=>{
  if(e.key!=='Tab')return;
  const root=!modal.hidden?rForm:drawer.classList.contains('on')?drawer:null; if(!root)return;
  const f=[...root.querySelectorAll('button:not([disabled]),textarea,[href],input')]; if(!f.length)return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
const onWide=()=>{ if(wide.matches)S.drawer=false; render(); };
if(wide.addEventListener)wide.addEventListener('change',onWide); else if(wide.addListener)wide.addListener(onWide);
window.addEventListener('hashchange',()=>{ const k=location.hash.slice(1); if(k&&k!==S.route)go(k); });

const start=(location.hash||'').slice(1);
S.route=NAV.find(x=>x[0]===start)?start:'dashboard';
render();
})();
</script>

</body>
</html>
